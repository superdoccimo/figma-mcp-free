name: Canonicalize installed Plugin kit once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: canonicalize-plugin-kit
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Write the canonical installed Plugin CLI
        shell: bash
        run: |
          cat > packages/cli/src/plugin-cli.ts <<'EOF'
          #!/usr/bin/env node
          import { Command, InvalidArgumentError } from "commander";
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";

          function parsePort(value: string): number {
            const port = Number(value);
            if (!/^\d+$/.test(value) || !Number.isInteger(port) || port < 1 || port > 65535) {
              throw new InvalidArgumentError("Port must be an integer between 1 and 65535.");
            }
            return port;
          }

          const program = new Command()
            .name("figma-mcp-free-plugin")
            .description("Prepare the read-only Figma development Plugin kit")
            .version("0.1.0");

          program.command("manifest")
            .description("Generate a complete development Plugin kit for the exact local bridge port")
            .argument("<plugin-id>", "numeric ID generated by Figma Desktop")
            .argument("[port]", "local bridge port", parsePort, 3845)
            .option("--out <path>", "output manifest path", "./figma-mcp-free-plugin/manifest.json")
            .action((pluginId: string, port: number, options: { out: string }) => {
              if (!/^\d+$/.test(pluginId)) throw new InvalidArgumentError("Plugin ID must contain digits only.");
              const pluginDirectory = new URL("../plugin/", import.meta.url);
              const template = JSON.parse(readFileSync(new URL("manifest.template.json", pluginDirectory), "utf8"));
              template.id = pluginId;
              template.networkAccess.devAllowedDomains = [
                `http://127.0.0.1:${port}`,
                `http://localhost:${port}`
              ];

              const output = resolve(options.out);
              const outputDirectory = dirname(output);
              mkdirSync(outputDirectory, { recursive: true });
              writeFileSync(output, `${JSON.stringify(template, null, 2)}\n`, { encoding: "utf8", mode: 0o600 });
              for (const asset of ["code.js", "ui.html"]) {
                copyFileSync(new URL(asset, pluginDirectory), resolve(outputDirectory, asset));
              }
              console.log(`Created a complete Figma development Plugin kit in ${outputDirectory} for loopback bridge port ${port}.`);
            });

          program.parseAsync().catch((error: unknown) => {
            console.error(error instanceof Error ? error.message : "Plugin kit generation failed.");
            process.exitCode = 1;
          });
          EOF

      - name: Require the complete generated Plugin kit in packed-install smoke
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/smoke-packed-install.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = 'assert.equal(pluginManifest.id, "123456789");'
          addition = '''assert.equal(pluginManifest.id, "123456789");
              assert.equal(existsSync(join(dirname(generatedManifest), "code.js")), true);
              assert.equal(existsSync(join(dirname(generatedManifest), "ui.html")), true);'''
          if 'dirname(generatedManifest), "code.js"' not in text:
              if anchor not in text:
                  raise SystemExit('Plugin smoke anchor is missing')
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')

      - name: Remove superseded one-shot Plugin workflow
        run: rm -f .github/workflows/fix-installed-plugin-kit-once.yml

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/canonicalize-plugin-kit-once.yml

      - name: Commit verified Plugin kit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: package a complete importable Figma Plugin kit'
          git push origin HEAD:feat/productization-v1-20260830

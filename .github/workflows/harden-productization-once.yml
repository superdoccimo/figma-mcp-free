name: Harden productization once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: harden-productization-once
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Remove workspace protocols from the public manifest and repair Node 18 portability
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const root = readJson('package.json');
          const cli = readJson('packages/cli/package.json');
          root.devDependencies = { ...(root.devDependencies || {}), ...(cli.devDependencies || {}) };
          cli.devDependencies = {};
          writeJson('package.json', root);
          writeJson('packages/cli/package.json', cli);

          let publicCheck = fs.readFileSync('tools/check-public-package.mjs', 'utf8');
          publicCheck = publicCheck
            .replace('import { join, resolve } from "node:path";', 'import { dirname, join, resolve } from "node:path";\nimport { fileURLToPath } from "node:url";')
            .replace('const root = resolve(import.meta.dirname, "..");', 'const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");');
          fs.writeFileSync('tools/check-public-package.mjs', publicCheck);

          let smoke = fs.readFileSync('tools/smoke-packed-install.mjs', 'utf8');
          smoke = smoke
            .replace('import { existsSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";', 'import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";')
            .replace('import { basename, join, resolve } from "node:path";', 'import { basename, dirname, join, resolve } from "node:path";\nimport { fileURLToPath } from "node:url";')
            .replace('const root = resolve(import.meta.dirname, "..");', 'const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");')
            .replace('const installDir = join(workspace, "install");\n  writeFileSync', 'const installDir = join(workspace, "install");\n  mkdirSync(packDir, { recursive: true });\n  mkdirSync(installDir, { recursive: true });\n  writeFileSync');
          fs.writeFileSync('tools/smoke-packed-install.mjs', smoke);

          let evidence = fs.readFileSync('tools/check-desktop-evidence.mjs', 'utf8');
          evidence = evidence.replace(
            'const forbiddenKeys = /token|rawSnapshot|document|fileName|pageName|nodeName|nodeId/i;\nfunction walk(value, path = "$") {\n  if (!value || typeof value !== "object") return;\n  for (const [key, child] of Object.entries(value)) {\n    assert.doesNotMatch(key, forbiddenKeys, `Forbidden evidence key at ${path}.${key}`);',
            'const forbiddenKeys = new Set(["token", "pairingToken", "rawSnapshot", "document", "fileName", "pageName", "nodeName", "nodeId"]);\nfunction walk(value, path = "$") {\n  if (!value || typeof value !== "object") return;\n  for (const [key, child] of Object.entries(value)) {\n    assert.equal(forbiddenKeys.has(key), false, `Forbidden evidence key at ${path}.${key}`);'
          );
          fs.writeFileSync('tools/check-desktop-evidence.mjs', evidence);

          for (const item of [
            'I_WILL_NOT_CREATE_MORE_FILES', 'NO_MORE_PROBES', 'oops-again', '.productization-pr-marker',
            'DO_NOT_COMMIT_CHECK.tmp', 'DO_NOT_COMMIT_CHECK_2.tmp',
            'tools/apply-productization-once.mjs',
            '.github/workflows/apply-productization-once.yml',
            '.github/workflows/cleanup-productization-once.yml',
            '.github/workflows/cleanup-stray-once.yml',
            '.github/workflows/final-clean-productization-once.yml',
            '.github/workflows/remove-final-probe-once.yml',
            '.github/workflows/absolute-final-clean-once.yml',
            '.github/workflows/remove-last-probe-once.yml'
          ]) fs.rmSync(item, { force: true });

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/harden-productization-once.yml

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make the public tarball workspace-free and Node 18 compatible'
          git push origin HEAD:feat/productization-v1-20260830

name: Remove stray branch probe once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: cleanup-stray-productization
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: rm -f DO_NOT_COMMIT_CHECK_2.tmp
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/cleanup-stray-once.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove temporary branch probe'
          git push origin HEAD:feat/productization-v1-20260830

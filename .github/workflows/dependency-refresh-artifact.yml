name: Dependency refresh artifact

on:
  push:
    branches:
      - chore/post-merge-security-and-fork-audit-20260830

permissions:
  contents: read

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Pin patched dependency resolutions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const rootPath = 'package.json';
          const root = JSON.parse(readFileSync(rootPath, 'utf8'));
          root.pnpm = {
            ...(root.pnpm ?? {}),
            overrides: {
              ...(root.pnpm?.overrides ?? {}),
              '@hono/node-server': '1.19.15',
              'body-parser': '2.3.0',
              'esbuild': '0.28.1',
              'fast-uri': '3.1.6',
              'hono': '4.13.5',
              'ip-address': '10.7.0',
              'qs': '6.16.0'
            }
          };
          writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);

          const serverPath = 'packages/mcp-server/package.json';
          const server = JSON.parse(readFileSync(serverPath, 'utf8'));
          server.dependencies['@modelcontextprotocol/sdk'] = '^1.30.0';
          writeFileSync(serverPath, `${JSON.stringify(server, null, 2)}\n`);
          NODE

          pnpm install --no-frozen-lockfile
          pnpm dedupe

      - name: Record resolved security-sensitive dependencies
        shell: bash
        run: |
          {
            echo '# Dependency resolution'
            echo
            pnpm --filter @figma-mcp-free/server why @modelcontextprotocol/sdk || true
            pnpm --filter @figma-mcp-free/server why @hono/node-server || true
            pnpm --filter @figma-mcp-free/server why hono || true
            pnpm --filter @figma-mcp-free/server why body-parser || true
            pnpm --filter @figma-mcp-free/server why qs || true
            pnpm --filter @figma-mcp-free/server why fast-uri || true
            pnpm --filter @figma-mcp-free/server why ip-address || true
            pnpm why esbuild || true
          } | tee dependency-resolution.txt

      - name: Audit refreshed lockfile at all severities
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --audit-level low --json | tee dependency-audit.json

      - name: Run complete repository checks
        id: checks
        continue-on-error: true
        run: pnpm check

      - name: Upload refreshed dependency files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-refresh-${{ github.sha }}
          path: |
            package.json
            packages/mcp-server/package.json
            pnpm-lock.yaml
            dependency-audit.json
            dependency-resolution.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce refreshed dependency gates
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          if [[ "${AUDIT_OUTCOME}" != success || "${CHECKS_OUTCOME}" != success ]]; then
            echo "Refreshed dependency gate failed: audit=${AUDIT_OUTCOME}, checks=${CHECKS_OUTCOME}" >&2
            exit 1
          fi

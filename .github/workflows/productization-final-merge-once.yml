name: Finalize, verify, and merge productization once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: productization-final-merge-once
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Cancel superseded productization automations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --branch feat/productization-v1-20260830 --status in_progress --limit 100 --json databaseId,name \
            | jq -r '.[] | select(.name == "Verify and merge productization once" or .name == "Finalize productization once" or .name == "Finalize portable npm packaging once") | .databaseId' \
            | while read -r run_id; do
                [[ -z "$run_id" ]] || gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done

      - name: Checkout productization branch
        uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0

      - name: Rebase on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

      - name: Normalize the final candidate implementation
        shell: python
        run: |
          from pathlib import Path

          required = [
              "distribution/launcher.mjs",
              "distribution/mcp-entry.mjs",
              "distribution/plugin-cli.mjs",
              "tools/build-distribution.mjs",
              "tools/pack-distribution.mjs",
              "tools/smoke-distribution.mjs",
              "tools/desktop-smoke-evidence.mjs",
              "docs/distribution.md",
              "docs/desktop-smoke-test.md",
              "release-evidence/README.md",
              ".github/workflows/release-candidate.yml",
              ".github/workflows/productization-verification.yml",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Missing required productization files: {missing}")

          pack_path = Path("tools/pack-distribution.mjs")
          pack = pack_path.read_text(encoding="utf-8")
          npm_marker = 'const npmCommand = process.platform === "win32" ? "npm.cmd" : "npm";'
          if "const npmNeedsShell" not in pack:
              if npm_marker not in pack:
                  raise SystemExit("npm command marker not found in pack-distribution.mjs")
              pack = pack.replace(npm_marker, npm_marker + '\nconst npmNeedsShell = process.platform === "win32";', 1)
          pack_options = '{ cwd: staged.packageDir, encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }'
          if "shell: npmNeedsShell" not in pack:
              if pack_options not in pack:
                  raise SystemExit("npm pack options marker not found")
              pack = pack.replace(pack_options, '{ cwd: staged.packageDir, encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], shell: npmNeedsShell }', 1)
          pack_path.write_text(pack, encoding="utf-8")

          build_path = Path("tools/build-distribution.mjs")
          build = build_path.read_text(encoding="utf-8")
          build = build.replace(
              'await copyIfPresent(join(cliRoot, "README.md"), join(packageDir, "README.md"));',
              'await copyIfPresent(join(root, "README.md"), join(packageDir, "README.md"));'
          )
          misleading_exports = '''    main: "./dist/index.js",
              types: "./dist/index.d.ts",
              exports: {
                ".": {
                  types: "./dist/index.d.ts",
                  import: "./dist/index.js"
                },
                "./package.json": "./package.json"
              },
          '''.replace("              ", "")
          build = build.replace(misleading_exports, "")
          build_path.write_text(build, encoding="utf-8")

          smoke = r'''import { createHash } from "node:crypto";
          import { spawn, spawnSync } from "node:child_process";
          import { mkdtempSync } from "node:fs";
          import { mkdir, readFile, rm, writeFile } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join, resolve } from "node:path";
          import { packDistribution } from "./pack-distribution.mjs";

          const npmCommand = process.platform === "win32" ? "npm.cmd" : "npm";

          function run(command, args, options = {}) {
            const result = spawnSync(command, args, {
              cwd: options.cwd,
              env: options.env ?? process.env,
              encoding: "utf8",
              stdio: options.capture === false ? "inherit" : ["ignore", "pipe", "pipe"],
              windowsHide: true,
              shell: options.shell ?? false
            });
            if (result.status !== 0) {
              throw new Error([
                `Command failed (${result.status}): ${command} ${args.join(" ")}`,
                result.stdout,
                result.stderr
              ].filter(Boolean).join("\n"));
            }
            return { stdout: result.stdout ?? "", stderr: result.stderr ?? "" };
          }

          function runInstalled(launcher, args, options = {}) {
            return run(process.execPath, [launcher, ...args], options);
          }

          function sha256(buffer) {
            return createHash("sha256").update(buffer).digest("hex");
          }

          async function assertMcpStarts(launcher, cwd) {
            await new Promise((resolvePromise, reject) => {
              const child = spawn(process.execPath, [launcher, "mcp"], {
                cwd,
                env: { ...process.env, FIGMA_TOKEN: "" },
                stdio: ["pipe", "pipe", "pipe"],
                windowsHide: true
              });
              let stderr = "";
              let readyWindowPassed = false;
              let finished = false;
              let startTimer;
              let killTimer;
              child.stderr.setEncoding("utf8");
              child.stderr.on("data", (chunk) => { stderr += chunk; });

              const finish = (error) => {
                if (finished) return;
                finished = true;
                clearTimeout(startTimer);
                clearTimeout(killTimer);
                if (error) reject(error);
                else resolvePromise();
              };

              child.once("error", (error) => finish(error));
              child.once("exit", (code) => {
                if (finished) return;
                if (readyWindowPassed) finish();
                else finish(new Error(`MCP process exited before the smoke window with code ${code}.\n${stderr}`));
              });
              child.once("close", () => {
                if (!finished && readyWindowPassed) finish();
              });

              startTimer = setTimeout(() => {
                readyWindowPassed = true;
                try { child.kill("SIGTERM"); } catch { child.kill(); }
              }, 750);
              killTimer = setTimeout(() => {
                try { child.kill("SIGKILL"); } catch { child.kill(); }
                finish();
              }, 2500);
            });
          }

          export async function smokeDistribution(options = {}) {
            const workRoot = mkdtempSync(join(tmpdir(), "figma-mcp-free-smoke-"));
            const installRoot = join(workRoot, "consumer");
            try {
              let tarballPath;
              let expectedVersion;
              if (options.tarballPath) {
                tarballPath = resolve(options.tarballPath);
              } else {
                const packed = await packDistribution({ workRoot: join(workRoot, "pack") });
                tarballPath = packed.tarballPath;
                expectedVersion = packed.releaseManifest.version;
              }

              const tarball = await readFile(tarballPath);
              await mkdir(installRoot, { recursive: true });
              await writeFile(join(installRoot, "package.json"), `${JSON.stringify({ private: true }, null, 2)}\n`, "utf8");
              run(npmCommand, [
                "install",
                "--ignore-scripts",
                "--no-audit",
                "--no-fund",
                tarballPath
              ], { cwd: installRoot, shell: process.platform === "win32" });

              const installedRoot = join(installRoot, "node_modules", "figma-mcp-free");
              const installedManifest = JSON.parse(await readFile(join(installedRoot, "package.json"), "utf8"));
              if (expectedVersion && installedManifest.version !== expectedVersion) {
                throw new Error(`Installed version ${installedManifest.version} does not match ${expectedVersion}.`);
              }
              const bundledDependencies = installedManifest.bundledDependencies ?? installedManifest.bundleDependencies ?? [];
              if (!Array.isArray(bundledDependencies) || bundledDependencies.length < 5) {
                throw new Error("The standalone package does not declare its internal bundled dependencies.");
              }
              for (const name of bundledDependencies) {
                const packagePath = join(installedRoot, "node_modules", ...name.split("/"), "package.json");
                const manifest = JSON.parse(await readFile(packagePath, "utf8"));
                if (manifest.name !== name) throw new Error(`Bundled package identity mismatch for ${name}.`);
              }

              const launcher = join(installedRoot, installedManifest.bin["figma-mcp-free"]);
              const help = runInstalled(launcher, ["--help"], { cwd: installRoot });
              if (!/figma-mcp-free/i.test(help.stdout)) throw new Error("The installed CLI help output is missing its identity.");
              runInstalled(launcher, ["bridge", "--help"], { cwd: installRoot });
              runInstalled(launcher, ["plugin", "--help"], { cwd: installRoot });

              const generated = runInstalled(launcher, [
                "generate-from-json",
                join(installedRoot, "examples", "sample-node.json"),
                "--framework",
                "react",
                "--use-tokens",
                join(installedRoot, "examples", "sample-tokens.json")
              ], { cwd: installRoot });
              if (!/export|function|const/.test(generated.stdout)) {
                throw new Error("Offline generation did not produce recognizable starter code.");
              }

              const pluginDir = join(workRoot, "plugin");
              runInstalled(launcher, [
                "plugin",
                "create-manifest",
                "123456789",
                "--port",
                "49152",
                "--out-dir",
                pluginDir,
                "--json"
              ], { cwd: installRoot });
              runInstalled(launcher, ["plugin", "verify", pluginDir, "--json"], { cwd: installRoot });
              const pluginManifest = JSON.parse(await readFile(join(pluginDir, "manifest.json"), "utf8"));
              const expectedOrigins = ["http://127.0.0.1:49152", "http://localhost:49152"];
              if (JSON.stringify(pluginManifest.networkAccess?.devAllowedDomains) !== JSON.stringify(expectedOrigins)) {
                throw new Error("The installed Plugin manifest did not preserve the selected loopback port.");
              }

              await assertMcpStarts(launcher, installRoot);
              return {
                ok: true,
                platform: process.platform,
                node: process.version,
                package: installedManifest.name,
                version: installedManifest.version,
                sha256: sha256(tarball),
                bundledDependencies: bundledDependencies.length
              };
            } finally {
              if (!process.env.KEEP_FIGMA_MCP_SMOKE) await rm(workRoot, { recursive: true, force: true });
            }
          }

          const tarballIndex = process.argv.indexOf("--tarball");
          const tarballPath = tarballIndex >= 0 ? process.argv[tarballIndex + 1] : undefined;
          const result = await smokeDistribution({ tarballPath });
          console.log(JSON.stringify(result, null, 2));
          '''.replace("          ", "")
          Path("tools/smoke-distribution.mjs").write_text(smoke, encoding="utf-8")

          release_path = Path(".github/workflows/release-candidate.yml")
          release = release_path.read_text(encoding="utf-8")
          release = release.replace(
              "      - name: Clean-install candidate\n        run: pnpm dist:smoke",
              "      - name: Clean-install exact candidate tarball\n        shell: bash\n        run: pnpm dist:smoke -- --tarball \"$(find release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)\""
          )
          release_path.write_text(release, encoding="utf-8")

          docs_path = Path("docs/distribution.md")
          docs = docs_path.read_text(encoding="utf-8")
          if "--tarball" not in docs:
              docs = docs.replace(
                  "This command creates a temporary empty consumer project, installs only the generated tarball, and verifies:",
                  "This command creates a temporary empty consumer project, installs only the generated tarball, and verifies:\n\n```bash\npnpm dist:smoke -- --tarball ./release-artifacts/figma-mcp-free-<version>.tgz\n```\n\nPassing `--tarball` proves the exact previously hashed candidate instead of generating a substitute artifact. The smoke test verifies:"
              )
          docs_path.write_text(docs, encoding="utf-8")

      - name: Remove all temporary productization workflows
        run: |
          rm -f .github/workflows/productization-finalize-once.yml
          rm -f .github/workflows/productization-merge-once.yml
          rm -f .github/workflows/productization-portable-npm-once.yml
          rm -f .github/workflows/productization-final-merge-once.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete source gate
        run: pnpm check

      - name: Pack candidate and clean-install that exact tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          pnpm dist:pack -- --output release-artifacts
          tarball="$(find release-artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          pnpm dist:smoke -- --tarball "$tarball"

      - name: Audit committed dependencies
        run: pnpm audit --audit-level low

      - name: Commit final candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-artifacts
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'build: finalize exact-tarball productization'
          fi
          git push --force-with-lease origin HEAD:feat/productization-v1-20260830
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare the review pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/productization-v1-20260830
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'BODY'
          ## Purpose

          Produce one clean-installable `figma-mcp-free` npm release candidate while preserving the repository's internal package boundaries.

          ## Proof added

          - five internal runtime packages bundled into one tarball;
          - no `workspace:` protocols in shipped manifests;
          - one launcher for CLI, bridge, MCP, and installed Plugin setup;
          - clean install in an empty project on Linux Node.js 18/20/22, Windows Node.js 22, and macOS Node.js 22;
          - exact-tarball SHA-256 manifest and smoke testing of that same artifact;
          - machine-checked, credential-free Figma Desktop evidence;
          - no npm publication, GitHub Release, or Community Plugin submission.

          A real Figma Desktop evidence file and explicit human approval remain mandatory before publication.
          BODY
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title 'build: produce one clean-installable npm release candidate' --body-file /tmp/pr-body.md)"
            PR_NUMBER="${PR_URL##*/}"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title 'build: produce one clean-installable npm release candidate' --body-file /tmp/pr-body.md
            if [[ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
              gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
            fi
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head productization verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run productization-verification.yml --repo "$GITHUB_REPOSITORY" --ref feat/productization-v1-20260830

      - name: Wait for the dispatched verification
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=workflow_dispatch&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Productization verification")] | sort_by(.created_at) | last // {}')"
            status="$(jq -r '.status // "missing"' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi
            if [[ "$status" == "completed" ]]; then
              echo "Productization verification failed: $conclusion" >&2
              jq . <<<"$run" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for Productization verification.' >&2
          exit 1

      - name: Squash merge the exact verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$HEAD_SHA" \
            --subject 'build: produce one clean-installable npm release candidate' \
            --body 'Bundle internal runtime packages into one candidate, prove the exact tarball across Linux, Windows, and macOS, and retain Figma Desktop evidence plus human approval as publication gates.'

      - name: Verify the merged repository state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged_at // empty')"
          for path in \
            distribution/launcher.mjs \
            tools/build-distribution.mjs \
            tools/smoke-distribution.mjs \
            docs/desktop-smoke-test.md \
            .github/workflows/release-candidate.yml; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" >/dev/null
          done
          for path in \
            .github/workflows/productization-finalize-once.yml \
            .github/workflows/productization-merge-once.yml \
            .github/workflows/productization-portable-npm-once.yml \
            .github/workflows/productization-final-merge-once.yml; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" >/dev/null 2>&1; then
              echo "Temporary workflow leaked into main: ${path}" >&2
              exit 1
            fi
          done

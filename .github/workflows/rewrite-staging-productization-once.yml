name: Converge clean staging productization once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: converge-productization-staging
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Complete the initial source transformation if necessary
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/apply-productization-once.mjs ]]; then
            node tools/apply-productization-once.mjs
          fi

      - name: Normalize manifests and write canonical productization tools
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const writeJson = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n');

          const root = readJson('package.json');
          const cli = readJson('packages/cli/package.json');
          root.devDependencies = { ...(root.devDependencies || {}), ...(cli.devDependencies || {}), esbuild: '0.28.1' };
          root.scripts = {
            ...root.scripts,
            'build:public': 'node tools/build-public-package.mjs',
            'check:public': 'node tools/check-public-package.mjs',
            'pack:smoke': 'node tools/smoke-packed-install.mjs',
            'evidence:check': 'node tools/check-desktop-evidence.mjs',
            'release:check': 'pnpm check && pnpm run pack:smoke'
          };
          if (!root.scripts.check.includes('check:public')) {
            root.scripts.check = root.scripts.check.replace('&& pnpm run pack:check', '&& pnpm run check:public && pnpm run pack:check');
          }
          cli.private = true;
          cli.dependencies = {};
          cli.devDependencies = {};
          delete cli.optionalDependencies;
          delete cli.publishConfig;
          delete cli.files;
          delete cli.scripts.prepack;
          cli.scripts.build = 'node ../../tools/build-public-package.mjs';
          writeJson('package.json', root);
          writeJson('packages/cli/package.json', cli);

          for (const p of [
            'packages/mcp-server/package.json',
            'packages/figma-client/package.json',
            'packages/config/package.json',
            'packages/design-tokens/package.json',
            'packages/code-generator/package.json'
          ]) {
            const manifest = readJson(p);
            manifest.private = true;
            writeJson(p, manifest);
          }

          let ignore = fs.readFileSync('.gitignore', 'utf8');
          if (!ignore.split(/\r?\n/).includes('/build/')) ignore = ignore.trimEnd() + '\n/build/\n';
          fs.writeFileSync('.gitignore', ignore);

      - name: Write canonical build tool
        shell: bash
        run: |
          cat > tools/build-public-package.mjs <<'EOF'
          import { build } from "esbuild";
          import { chmodSync, cpSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const internalOut = join(root, "packages", "cli", "dist");
          const internalPlugin = join(root, "packages", "cli", "plugin");
          const publicRoot = join(root, "build", "public-package");

          rmSync(internalOut, { recursive: true, force: true });
          rmSync(internalPlugin, { recursive: true, force: true });
          rmSync(publicRoot, { recursive: true, force: true });
          mkdirSync(internalOut, { recursive: true });

          await build({
            absWorkingDir: root,
            entryPoints: {
              index: "packages/cli/src/index.ts",
              "bridge-cli": "packages/cli/src/bridge-cli.ts",
              "mcp-cli": "packages/cli/src/mcp-cli.ts",
              "verify-desktop": "packages/cli/src/verify-desktop.ts",
              "plugin-cli": "packages/cli/src/plugin-cli.ts"
            },
            outdir: internalOut,
            bundle: true,
            platform: "node",
            format: "esm",
            target: "node18",
            legalComments: "external",
            sourcemap: false,
            treeShaking: true,
            charset: "utf8",
            logLevel: "silent"
          });

          for (const name of ["index.js", "bridge-cli.js", "mcp-cli.js", "verify-desktop.js", "plugin-cli.js"]) {
            const target = join(internalOut, name);
            const body = readFileSync(target, "utf8").replace(/^#![^\n]*\n/, "");
            writeFileSync(target, `#!/usr/bin/env node\n${body}`, "utf8");
            chmodSync(target, 0o755);
          }

          cpSync(join(root, "plugins", "local-bridge"), internalPlugin, {
            recursive: true,
            filter: (source) => !source.endsWith("manifest.json")
          });

          let commit = process.env.GITHUB_SHA || "unknown";
          try {
            commit = execFileSync("git", ["rev-parse", "HEAD"], { cwd: root, encoding: "utf8" }).trim();
          } catch {}
          const version = JSON.parse(readFileSync(join(root, "packages", "cli", "package.json"), "utf8")).version;
          writeFileSync(join(internalOut, "build-info.json"), `${JSON.stringify({ version, commit }, null, 2)}\n`, "utf8");

          mkdirSync(publicRoot, { recursive: true });
          cpSync(internalOut, join(publicRoot, "dist"), { recursive: true });
          cpSync(internalPlugin, join(publicRoot, "plugin"), { recursive: true });
          cpSync(join(root, "README.md"), join(publicRoot, "README.md"));
          cpSync(join(root, "LICENSE"), join(publicRoot, "LICENSE"));

          const publicManifest = {
            name: "figma-mcp-free",
            version,
            description: "Quota-aware, read-only Figma tooling for MCP, CLI, design tokens, starter code, and an authenticated local Plugin bridge",
            license: "MIT",
            type: "module",
            engines: { node: ">=18" },
            bin: {
              "figma-mcp-free": "dist/index.js",
              "figma-mcp-free-bridge": "dist/bridge-cli.js",
              "figma-mcp-free-mcp": "dist/mcp-cli.js",
              "figma-mcp-free-verify-desktop": "dist/verify-desktop.js",
              "figma-mcp-free-plugin": "dist/plugin-cli.js"
            },
            files: ["dist", "plugin", "README.md", "LICENSE"],
            dependencies: {},
            repository: { type: "git", url: "git+https://github.com/superdoccimo/figma-mcp-free.git" },
            bugs: { url: "https://github.com/superdoccimo/figma-mcp-free/issues" },
            homepage: "https://github.com/superdoccimo/figma-mcp-free#readme"
          };
          writeFileSync(join(publicRoot, "package.json"), `${JSON.stringify(publicManifest, null, 2)}\n`, "utf8");
          EOF

      - name: Write canonical public-package check
        shell: bash
        run: |
          cat > tools/check-public-package.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";
          import { dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const directory = join(root, "build", "public-package");
          const manifest = JSON.parse(readFileSync(join(directory, "package.json"), "utf8"));

          assert.equal(manifest.name, "figma-mcp-free");
          assert.equal(manifest.private, undefined);
          assert.deepEqual(manifest.dependencies, {});
          assert.equal(Object.prototype.hasOwnProperty.call(manifest, "scripts"), false);
          assert.doesNotMatch(JSON.stringify(manifest), /workspace:/);

          const expectedBins = {
            "figma-mcp-free": "dist/index.js",
            "figma-mcp-free-bridge": "dist/bridge-cli.js",
            "figma-mcp-free-mcp": "dist/mcp-cli.js",
            "figma-mcp-free-verify-desktop": "dist/verify-desktop.js",
            "figma-mcp-free-plugin": "dist/plugin-cli.js"
          };
          assert.deepEqual(manifest.bin, expectedBins);

          for (const path of [
            ...Object.values(expectedBins),
            "dist/build-info.json",
            "plugin/manifest.template.json",
            "plugin/code.js",
            "plugin/ui.html",
            "README.md",
            "LICENSE"
          ]) {
            assert.equal(existsSync(join(directory, path)), true, `Public package file is missing: ${path}`);
          }
          for (const path of Object.values(expectedBins)) {
            assert.match(readFileSync(join(directory, path), "utf8"), /^#!\/usr\/bin\/env node\n/);
          }
          assert.equal(existsSync(join(directory, "plugin", "manifest.json")), false);
          console.log("Public package check passed: clean staging manifest, five bundled binaries, Plugin assets, and no workspace runtime dependencies.");
          EOF

      - name: Write canonical packed-install smoke
        shell: bash
        run: |
          cat > tools/smoke-packed-install.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { basename, dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import { spawnSync } from "node:child_process";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const packageDir = join(root, "build", "public-package");
          const workspace = mkdtempSync(join(tmpdir(), "figma-mcp-free-packed-"));
          const npm = process.platform === "win32" ? "npm.cmd" : "npm";

          function run(command, args, cwd) {
            const result = spawnSync(command, args, { cwd, encoding: "utf8", timeout: 180000 });
            if (result.status !== 0) {
              throw new Error(`Command failed (${command} ${args.join(" ")}):\n${result.stdout}\n${result.stderr}`);
            }
            return result.stdout;
          }

          try {
            run(process.execPath, [join(root, "tools", "build-public-package.mjs")], root);
            const packDir = join(workspace, "pack");
            const installDir = join(workspace, "install");
            mkdirSync(packDir, { recursive: true });
            mkdirSync(installDir, { recursive: true });

            const stdout = run(npm, ["pack", "--json", "--pack-destination", packDir], packageDir);
            const match = stdout.match(/\[\s*\{[\s\S]*\}\s*\]\s*$/);
            if (!match) throw new Error(`npm pack did not return JSON:\n${stdout}`);
            const packed = JSON.parse(match[0]);
            const tarball = join(packDir, packed[0].filename);
            assert.equal(existsSync(tarball), true);

            writeFileSync(join(installDir, "package.json"), JSON.stringify({ name: "packed-smoke", private: true }), "utf8");
            run(npm, ["install", "--ignore-scripts", "--no-audit", "--no-fund", tarball], installDir);

            const packageRoot = join(installDir, "node_modules", "figma-mcp-free");
            const manifest = JSON.parse(readFileSync(join(packageRoot, "package.json"), "utf8"));
            assert.equal(manifest.name, "figma-mcp-free");
            assert.deepEqual(manifest.dependencies, {});
            assert.doesNotMatch(JSON.stringify(manifest), /workspace:/);
            assert.equal(Object.prototype.hasOwnProperty.call(manifest, "scripts"), false);

            const binDir = join(installDir, "node_modules", ".bin");
            const suffix = process.platform === "win32" ? ".cmd" : "";
            for (const name of [
              "figma-mcp-free",
              "figma-mcp-free-bridge",
              "figma-mcp-free-mcp",
              "figma-mcp-free-verify-desktop",
              "figma-mcp-free-plugin"
            ]) {
              run(join(binDir, `${name}${suffix}`), ["--help"], installDir);
            }

            const generatedManifest = join(workspace, "plugin", "manifest.json");
            run(join(binDir, `figma-mcp-free-plugin${suffix}`), ["manifest", "123456789", "49152", "--out", generatedManifest], installDir);
            const pluginManifest = JSON.parse(readFileSync(generatedManifest, "utf8"));
            assert.equal(pluginManifest.id, "123456789");
            assert.deepEqual(pluginManifest.networkAccess.devAllowedDomains, [
              "http://127.0.0.1:49152",
              "http://localhost:49152"
            ]);
            assert.equal(existsSync(join(packageRoot, "plugin", "manifest.template.json")), true);
            run(npm, ["ls", "--omit=dev", "--all"], installDir);
            console.log(`Packed install smoke passed on ${process.platform}/${process.arch}: ${basename(tarball)}`);
          } finally {
            rmSync(workspace, { recursive: true, force: true });
          }
          EOF

      - name: Write canonical Desktop evidence validator
        shell: bash
        run: |
          cat > tools/check-desktop-evidence.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const args = process.argv.slice(2);
          const allowUncleared = args.includes("--allow-uncleared");
          const path = args.find((value) => !value.startsWith("--"));
          if (!path) {
            console.error("Usage: node tools/check-desktop-evidence.mjs <evidence.json> [--expected-commit=<sha>] [--allow-uncleared]");
            process.exit(1);
          }
          const expectedCommit = args.find((value) => value.startsWith("--expected-commit="))?.split("=", 2)[1];
          const evidence = JSON.parse(readFileSync(path, "utf8"));
          assert.equal(evidence.schemaVersion, 1);
          assert.match(evidence.generatedAt, /^\d{4}-\d{2}-\d{2}T/);
          assert.match(evidence.candidate?.commit, /^[0-9a-f]{40}$/);
          assert.equal(evidence.confirmations?.pluginImportedInFigmaDesktop, true);
          assert.equal(evidence.confirmations?.captureTriggeredByHuman, true);
          if (expectedCommit) assert.equal(evidence.candidate.commit, expectedCommit);
          for (const id of ["health", "snapshot", "inspect"]) {
            assert.equal(evidence.checks.find((check) => check.id === id)?.status, "pass", `${id} must pass`);
          }
          assert.equal(evidence.checks.some((check) => check.id.startsWith("generate-") && check.status === "pass"), true);
          if (!allowUncleared) assert.equal(evidence.checks.find((check) => check.id === "clear")?.status, "pass");
          assert.equal(evidence.privacy?.rawDesignIncluded, false);
          assert.equal(evidence.privacy?.fileOrPageNamesIncluded, false);
          assert.equal(evidence.privacy?.nodeNamesOrIdsIncluded, false);
          assert.equal(evidence.privacy?.pairingTokenIncluded, false);
          if (!allowUncleared) assert.equal(evidence.privacy?.snapshotRetained, false);

          const forbiddenKeys = new Set(["token", "pairingToken", "rawSnapshot", "document", "fileName", "pageName", "nodeName", "nodeId"]);
          function walk(value, location = "$") {
            if (!value || typeof value !== "object") return;
            for (const [key, child] of Object.entries(value)) {
              assert.equal(forbiddenKeys.has(key), false, `Forbidden evidence key at ${location}.${key}`);
              walk(child, `${location}.${key}`);
            }
          }
          walk(evidence);
          console.log(`Desktop evidence check passed for ${evidence.candidate.commit}.`);
          EOF

      - name: Write canonical release-candidate workflow
        shell: bash
        run: |
          cat > .github/workflows/release-candidate.yml <<'EOF'
          name: Release candidate

          on:
            workflow_dispatch:
              inputs:
                ref:
                  description: Exact branch, tag, or commit to verify
                  required: true
                  default: main

          permissions:
            contents: read

          concurrency:
            group: release-candidate-${{ inputs.ref }}
            cancel-in-progress: false

          jobs:
            packed-install:
              name: packed install (${{ matrix.os }})
              runs-on: ${{ matrix.os }}
              timeout-minutes: 25
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-24.04, windows-latest, macos-latest]
              steps:
                - uses: actions/checkout@v7
                  with:
                    ref: ${{ inputs.ref }}
                    fetch-depth: 0
                    persist-credentials: false
                - uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - uses: actions/setup-node@v7
                  with:
                    node-version: 22.x
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - run: pnpm install --frozen-lockfile
                - run: pnpm release:check

            artifact:
              name: unsigned package artifact
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v7
                  with:
                    ref: ${{ inputs.ref }}
                    fetch-depth: 0
                    persist-credentials: false
                - uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - uses: actions/setup-node@v7
                  with:
                    node-version: 22.x
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - run: pnpm install --frozen-lockfile
                - name: Build and pack without publishing
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p release-artifacts
                    pnpm run build:public
                    npm pack --pack-destination "$PWD/release-artifacts" ./build/public-package
                    cd release-artifacts
                    sha256sum *.tgz > SHA256SUMS
                - uses: actions/upload-artifact@v7
                  with:
                    name: figma-mcp-free-unsigned-${{ github.run_id }}
                    path: release-artifacts/
                    if-no-files-found: error
                    retention-days: 14
          EOF

      - name: Ensure the three-OS packed-install CI job exists
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          if 'name: packed install (${{ matrix.os }}, 22.x)' not in text:
              text = text.rstrip() + '''

            packed-install:
              name: packed install (${{ matrix.os }}, 22.x)
              runs-on: ${{ matrix.os }}
              timeout-minutes: 25
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-24.04, windows-latest, macos-latest]

              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - name: Setup pnpm
                  uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - name: Setup Node.js 22.x
                  uses: actions/setup-node@v7
                  with:
                    node-version: 22.x
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
                - name: Smoke-test the packed public package
                  run: pnpm run pack:smoke
          '''
              path.write_text(text, encoding='utf-8')

      - name: Remove every temporary branch helper
        shell: bash
        run: |
          rm -f I_WILL_NOT_CREATE_MORE_FILES NO_MORE_PROBES oops-again .productization-pr-marker
          rm -f DO_NOT_COMMIT_CHECK.tmp DO_NOT_COMMIT_CHECK_2.tmp
          rm -f tools/apply-productization-once.mjs
          rm -f .github/workflows/apply-productization-once.yml
          rm -f .github/workflows/cleanup-productization-once.yml
          rm -f .github/workflows/cleanup-stray-once.yml
          rm -f .github/workflows/final-clean-productization-once.yml
          rm -f .github/workflows/remove-final-probe-once.yml
          rm -f .github/workflows/absolute-final-clean-once.yml
          rm -f .github/workflows/remove-last-probe-once.yml
          rm -f .github/workflows/harden-productization-once.yml
          rm -f .github/workflows/use-clean-staging-package-once.yml

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/rewrite-staging-productization-once.yml

      - name: Commit converged productization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: converge on a clean single-package release candidate'
          git push origin HEAD:feat/productization-v1-20260830

name: Finalize productization code once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: finalize-productization-code
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Preserve workspace build ordering without leaking it into the staging manifest
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cli = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          cli.private = true;
          cli.dependencies = {};
          cli.devDependencies = { ...(root.devDependencies || {}) };
          delete cli.publishConfig;
          delete cli.files;
          delete cli.scripts.prepack;
          fs.writeFileSync('packages/cli/package.json', JSON.stringify(cli, null, 2) + '\n');

          let verifier = fs.readFileSync('packages/cli/src/verify-desktop.ts', 'utf8');
          verifier = verifier.replace(
            'writeFileSync(output, `${JSON.stringify(evidence, null, 2)}\\n`, { encoding: "utf8", mode: 0o600 });\n    console.log(`Desktop smoke evidence: ${output}`);\n    console.log(`Evidence SHA256: ${hash(JSON.stringify(evidence))}`);',
            'const serialized = `${JSON.stringify(evidence, null, 2)}\\n`;\n    writeFileSync(output, serialized, { encoding: "utf8", mode: 0o600 });\n    console.log(`Desktop smoke evidence: ${output}`);\n    console.log(`Evidence SHA256: ${hash(serialized)}`);'
          );
          fs.writeFileSync('packages/cli/src/verify-desktop.ts', verifier);

      - name: Write Windows-aware clean-install smoke
        shell: bash
        run: |
          cat > tools/smoke-packed-install.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { existsSync, mkdirSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { basename, dirname, join, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          import { spawnSync } from "node:child_process";

          const root = resolve(dirname(fileURLToPath(import.meta.url)), "..");
          const packageDir = join(root, "build", "public-package");
          const workspace = mkdtempSync(join(tmpdir(), "figma-mcp-free-packed-"));
          const npm = process.platform === "win32" ? "npm.cmd" : "npm";

          function run(command, args, cwd, options = {}) {
            const result = spawnSync(command, args, {
              cwd,
              encoding: "utf8",
              timeout: 180000,
              ...options
            });
            if (result.status !== 0) {
              throw new Error(`Command failed (${command} ${args.join(" ")}):\n${result.stdout}\n${result.stderr}`);
            }
            return result.stdout;
          }

          try {
            run(process.execPath, [join(root, "tools", "build-public-package.mjs")], root);
            const packDir = join(workspace, "pack");
            const installDir = join(workspace, "install");
            mkdirSync(packDir, { recursive: true });
            mkdirSync(installDir, { recursive: true });

            const stdout = run(npm, ["pack", "--json", "--pack-destination", packDir], packageDir);
            const match = stdout.match(/\[\s*\{[\s\S]*\}\s*\]\s*$/);
            if (!match) throw new Error(`npm pack did not return JSON:\n${stdout}`);
            const packed = JSON.parse(match[0]);
            const tarball = join(packDir, packed[0].filename);
            assert.equal(existsSync(tarball), true);

            writeFileSync(join(installDir, "package.json"), JSON.stringify({ name: "packed-smoke", private: true }), "utf8");
            run(npm, ["install", "--ignore-scripts", "--no-audit", "--no-fund", tarball], installDir);

            const packageRoot = join(installDir, "node_modules", "figma-mcp-free");
            const manifest = JSON.parse(readFileSync(join(packageRoot, "package.json"), "utf8"));
            assert.equal(manifest.name, "figma-mcp-free");
            assert.deepEqual(manifest.dependencies, {});
            assert.doesNotMatch(JSON.stringify(manifest), /workspace:/);
            assert.equal(Object.prototype.hasOwnProperty.call(manifest, "scripts"), false);

            const binDir = join(installDir, "node_modules", ".bin");
            const suffix = process.platform === "win32" ? ".cmd" : "";
            function runBin(name, args) {
              return run(join(binDir, `${name}${suffix}`), args, installDir, {
                shell: process.platform === "win32"
              });
            }
            for (const name of [
              "figma-mcp-free",
              "figma-mcp-free-bridge",
              "figma-mcp-free-mcp",
              "figma-mcp-free-verify-desktop",
              "figma-mcp-free-plugin"
            ]) {
              runBin(name, ["--help"]);
            }

            const generatedManifest = join(workspace, "plugin", "manifest.json");
            runBin("figma-mcp-free-plugin", ["manifest", "123456789", "49152", "--out", generatedManifest]);
            const pluginManifest = JSON.parse(readFileSync(generatedManifest, "utf8"));
            assert.equal(pluginManifest.id, "123456789");
            assert.deepEqual(pluginManifest.networkAccess.devAllowedDomains, [
              "http://127.0.0.1:49152",
              "http://localhost:49152"
            ]);
            assert.equal(existsSync(join(packageRoot, "plugin", "manifest.template.json")), true);
            run(npm, ["ls", "--omit=dev", "--all"], installDir);
            console.log(`Packed install smoke passed on ${process.platform}/${process.arch}: ${basename(tarball)}`);
          } finally {
            rmSync(workspace, { recursive: true, force: true });
          }
          EOF

      - name: Write canonical CI matrix
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main, master]
            pull_request:
              branches: [main, master]

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              name: verify (${{ matrix.node-version }})
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              strategy:
                fail-fast: false
                matrix:
                  node-version: [18.x, 20.x, 22.x]
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - name: Setup pnpm
                  uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - name: Setup Node.js ${{ matrix.node-version }}
                  uses: actions/setup-node@v7
                  with:
                    node-version: ${{ matrix.node-version }}
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
                - name: Build
                  run: pnpm run build
                - name: Typecheck
                  run: pnpm run typecheck
                - name: Unit and fixture tests
                  run: pnpm run test
                - name: Offline smoke tests
                  run: pnpm run smoke
                - name: Check secret patterns
                  run: pnpm run check:secrets
                - name: Check general portability
                  run: pnpm run check:portability
                - name: Check structured fork policy
                  run: pnpm run check:fork
                - name: Check local plugin boundary
                  run: pnpm run check:plugin
                - name: Check public staging package
                  run: pnpm run check:public
                - name: Check package contents
                  run: pnpm run pack:check
                - name: Check pull request whitespace
                  if: github.event_name == 'pull_request'
                  run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

            cross-platform:
              name: verify (${{ matrix.os }}, 22.x)
              runs-on: ${{ matrix.os }}
              timeout-minutes: 20
              strategy:
                fail-fast: false
                matrix:
                  os: [windows-latest, macos-latest]
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - name: Setup pnpm
                  uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - name: Setup Node.js 22.x
                  uses: actions/setup-node@v7
                  with:
                    node-version: 22.x
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
                - name: Run complete repository checks
                  run: pnpm check

            packed-install:
              name: packed install (${{ matrix.os }}, 22.x)
              runs-on: ${{ matrix.os }}
              timeout-minutes: 25
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-24.04, windows-latest, macos-latest]
              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - name: Setup pnpm
                  uses: pnpm/action-setup@v6
                  with:
                    version: 9.15.9
                - name: Setup Node.js 22.x
                  uses: actions/setup-node@v7
                  with:
                    node-version: 22.x
                    cache: pnpm
                    cache-dependency-path: pnpm-lock.yaml
                - name: Install dependencies
                  run: pnpm install --frozen-lockfile
                - name: Smoke-test the packed public package
                  run: pnpm run pack:smoke
          EOF

      - name: Remove temporary workflows and probes
        shell: bash
        run: |
          rm -f I_WILL_NOT_CREATE_MORE_FILES NO_MORE_PROBES oops-again .productization-pr-marker
          rm -f DO_NOT_COMMIT_CHECK.tmp DO_NOT_COMMIT_CHECK_2.tmp
          rm -f tools/apply-productization-once.mjs
          rm -f .github/workflows/apply-productization-once.yml
          rm -f .github/workflows/cleanup-productization-once.yml
          rm -f .github/workflows/cleanup-stray-once.yml
          rm -f .github/workflows/final-clean-productization-once.yml
          rm -f .github/workflows/remove-final-probe-once.yml
          rm -f .github/workflows/absolute-final-clean-once.yml
          rm -f .github/workflows/remove-last-probe-once.yml
          rm -f .github/workflows/harden-productization-once.yml
          rm -f .github/workflows/use-clean-staging-package-once.yml
          rm -f .github/workflows/rewrite-staging-productization-once.yml

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/finalize-productization-code-once.yml

      - name: Commit final productization code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize three-OS packed-install productization'
          git push origin HEAD:feat/productization-v1-20260830

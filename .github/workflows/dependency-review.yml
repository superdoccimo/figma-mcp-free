name: Dependency review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Detect dependency graph support
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/dependency-graph-sbom.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/dependency-graph/sbom")"

          case "${status}" in
            200)
              echo 'supported=true' >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo 'supported=false' >> "${GITHUB_OUTPUT}"
              echo '::warning title=Dependency graph unavailable::Running a lockfile audit fallback. Enable Dependency graph for change-aware dependency review.'
              ;;
            *)
              echo "Unexpected dependency graph probe response: HTTP ${status}" >&2
              cat /tmp/dependency-graph-sbom.json >&2 || true
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low

      - name: Checkout for lockfile audit fallback
        if: steps.dependency-graph.outputs.supported != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm for lockfile audit fallback
        if: steps.dependency-graph.outputs.supported != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js for lockfile audit fallback
        if: steps.dependency-graph.outputs.supported != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Audit committed dependencies
        if: steps.dependency-graph.outputs.supported != 'true'
        run: pnpm audit --audit-level low

      - name: Explain fallback
        if: steps.dependency-graph.outputs.supported != 'true'
        run: |
          {
            echo '### Dependency review fallback'
            echo
            echo 'GitHub Dependency graph is unavailable, so this run used `pnpm audit --audit-level low` against the committed lockfile.'
            echo 'Enable Dependency graph in repository security settings to restore change-aware dependency review.'
          } >> "${GITHUB_STEP_SUMMARY}"

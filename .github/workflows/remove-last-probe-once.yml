name: Remove last temporary probe once

on:
  push:
    branches:
      - feat/productization-v1-20260830

permissions:
  contents: write

concurrency:
  group: remove-last-productization-probe
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/productization-v1-20260830
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Remove stray probe
        run: rm -f I_WILL_NOT_CREATE_MORE_FILES
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: rm -f .github/workflows/remove-last-probe-once.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove temporary productization probe'
          git push origin HEAD:feat/productization-v1-20260830

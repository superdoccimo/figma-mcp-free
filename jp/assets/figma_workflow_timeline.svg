<svg viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">figma-mcp-freeの検証可能なworkflow</title>
  <desc id="desc">backend選択、安全な接続、bounded inspection、starter code生成、verificationの5段階。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1080" height="360" fill="#f8fafc"/>
  <text x="540" y="42" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" font-weight="700" fill="#0f172a" text-anchor="middle">検証可能なFigma-to-Code Workflow</text>
  <text x="540" y="68" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" fill="#475569" text-anchor="middle">5分保証なし、無制限API主張なし、隠れたFigma writeなし</text>

  <path d="M205 187 L230 187" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M415 187 L440 187" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M625 187 L650 187" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M835 187 L860 187" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="20" y="105" width="185" height="164" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="112" cy="137" r="20" fill="#7c3aed"/>
    <text x="112" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="112" y="178" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#4c1d95" text-anchor="middle">経路を選ぶ</text>
    <text x="112" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">headlessはREST</text>
    <text x="112" y="228" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">現在selectionはPlugin</text>
    <text x="112" y="250" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">最も狭いboundaryを使う</text>
  </g>

  <g>
    <rect x="230" y="105" width="185" height="164" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="322" cy="137" r="20" fill="#2563eb"/>
    <text x="322" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="322" y="178" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">安全に接続</text>
    <text x="322" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">PATまたはpairing token</text>
    <text x="322" y="228" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">tool schemaの外へ置く</text>
    <text x="322" y="250" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">doctor / bridge status</text>
  </g>

  <g>
    <rect x="440" y="105" width="185" height="164" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <circle cx="532" cy="137" r="20" fill="#0f766e"/>
    <text x="532" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="532" y="178" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">小さくinspect</text>
    <text x="532" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">depthとchildrenを制限</text>
    <text x="532" y="228" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">複数nodeはbatch</text>
    <text x="532" y="250" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">full file乱用を避ける</text>
  </g>

  <g>
    <rect x="650" y="105" width="185" height="164" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
    <circle cx="742" cy="137" r="20" fill="#c2410c"/>
    <text x="742" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="742" y="178" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#9a3412" text-anchor="middle">starter code生成</text>
    <text x="742" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">React / Vue / Svelte / HTML</text>
    <text x="742" y="228" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">Design Tokenはoptional</text>
    <text x="742" y="250" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">pixel-perfect保証なし</text>
  </g>

  <g>
    <rect x="860" y="105" width="185" height="164" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <circle cx="952" cy="137" r="20" fill="#334155"/>
    <text x="952" y="144" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="952" y="178" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">verifyして適応</text>
    <text x="952" y="207" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">accessibility / responsive</text>
    <text x="952" y="228" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="13" fill="#334155" text-anchor="middle">lint / test / build</text>
    <text x="952" y="250" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">human reviewが最終gate</text>
  </g>

  <rect x="150" y="300" width="780" height="38" rx="19" fill="#0f172a"/>
  <text x="540" y="325" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">read-only default • credentialはmodel inputの外 • private outputはuser管理</text>
</svg>

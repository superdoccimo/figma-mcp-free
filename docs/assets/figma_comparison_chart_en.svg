<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two read paths in figma-mcp-free</title>
  <desc id="desc">An accurate comparison of REST mode and the Local Plugin Bridge, both feeding the same read-only implementation pipeline.</desc>
  <rect width="1080" height="600" fill="#f8fafc"/>

  <text x="540" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Two Read Paths, One Reviewable Pipeline</text>
  <text x="540" y="82" font-family="Arial, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Choose the backend that fits the job. Neither mode writes to Figma.</text>

  <rect x="55" y="112" width="455" height="350" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="55" y="112" width="455" height="62" rx="18" fill="#2563eb"/>
  <rect x="55" y="148" width="455" height="26" fill="#2563eb"/>
  <text x="282" y="151" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">REST Mode</text>

  <text x="82" y="211" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Best for</text>
  <text x="195" y="211" font-family="Arial, sans-serif" font-size="14" fill="#334155">URLs, CI, headless jobs, remote automation</text>
  <line x1="82" y1="230" x2="482" y2="230" stroke="#e2e8f0"/>

  <text x="82" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Credential</text>
  <text x="195" y="265" font-family="Arial, sans-serif" font-size="14" fill="#334155">Figma Personal Access Token</text>
  <line x1="82" y1="284" x2="482" y2="284" stroke="#e2e8f0"/>

  <text x="82" y="319" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">REST calls</text>
  <text x="195" y="319" font-family="Arial, sans-serif" font-size="14" fill="#334155">Used with batching, cache, and diagnostics</text>
  <line x1="82" y1="338" x2="482" y2="338" stroke="#e2e8f0"/>

  <text x="82" y="373" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Requires</text>
  <text x="195" y="373" font-family="Arial, sans-serif" font-size="14" fill="#334155">Network access to the Figma REST API</text>
  <line x1="82" y1="392" x2="482" y2="392" stroke="#e2e8f0"/>

  <text x="82" y="427" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Strength</text>
  <text x="195" y="427" font-family="Arial, sans-serif" font-size="14" fill="#334155">Works without Figma Desktop</text>

  <rect x="570" y="112" width="455" height="350" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <rect x="570" y="112" width="455" height="62" rx="18" fill="#0f766e"/>
  <rect x="570" y="148" width="455" height="26" fill="#0f766e"/>
  <text x="797" y="151" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Local Plugin Bridge</text>

  <text x="597" y="211" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Best for</text>
  <text x="710" y="211" font-family="Arial, sans-serif" font-size="14" fill="#334155">The design currently open and selected</text>
  <line x1="597" y1="230" x2="997" y2="230" stroke="#e2e8f0"/>

  <text x="597" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Credential</text>
  <text x="710" y="265" font-family="Arial, sans-serif" font-size="14" fill="#334155">Short-lived local pairing token</text>
  <line x1="597" y1="284" x2="997" y2="284" stroke="#e2e8f0"/>

  <text x="597" y="319" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">REST calls</text>
  <text x="710" y="319" font-family="Arial, sans-serif" font-size="14" fill="#334155">None for the captured selection</text>
  <line x1="597" y1="338" x2="997" y2="338" stroke="#e2e8f0"/>

  <text x="597" y="373" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Requires</text>
  <text x="710" y="373" font-family="Arial, sans-serif" font-size="14" fill="#334155">Figma Desktop and explicit capture</text>
  <line x1="597" y1="392" x2="997" y2="392" stroke="#e2e8f0"/>

  <text x="597" y="427" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Strength</text>
  <text x="710" y="427" font-family="Arial, sans-serif" font-size="14" fill="#334155">Authenticated loopback, memory-only snapshot</text>

  <path d="M282 462 L282 500 L540 500" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M797 462 L797 500 L540 500" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="540,500 528,493 528,507" fill="#64748b"/>

  <rect x="145" y="510" width="790" height="66" rx="16" fill="#0f172a"/>
  <text x="540" y="539" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Shared pipeline: bounded inspection, design tokens, starter code</text>
  <text x="540" y="562" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Read-only by default. Not the official get_design_context output. No unlimited API claim.</text>
</svg>

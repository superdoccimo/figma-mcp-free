<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">figma-mcp-free dual-backend architecture</title>
  <desc id="desc">MCP clients and terminals use either a quota-aware REST backend or an authenticated local Figma Plugin bridge, then share inspection, token, and starter-code stages.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1080" height="560" fill="#f8fafc"/>
  <text x="540" y="45" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">figma-mcp-free Architecture</text>
  <text x="540" y="72" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Independent read backends, shared implementation pipeline, explicit security boundaries</text>

  <rect x="300" y="98" width="480" height="68" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="540" y="126" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4c1d95" text-anchor="middle">AI coding client or terminal</text>
  <text x="540" y="151" font-family="Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Claude • Cursor • Codex • Windsurf • Cline • local scripts</text>

  <path d="M540 166 L540 196" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="355" y="202" width="370" height="64" rx="14" fill="#0f172a"/>
  <text x="540" y="230" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Unified MCP server or CLI</text>
  <text x="540" y="253" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Credentials come from process environment, not model-visible tool inputs</text>

  <path d="M440 266 L290 302" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 266 L790 302" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="65" y="310" width="430" height="142" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="280" y="342" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8" text-anchor="middle">Quota-aware REST backend</text>
  <text x="92" y="375" font-family="Arial, sans-serif" font-size="14" fill="#334155">• PAT authentication and URL parsing</text>
  <text x="92" y="399" font-family="Arial, sans-serif" font-size="14" fill="#334155">• Batch node reads, cache, in-flight deduplication</text>
  <text x="92" y="423" font-family="Arial, sans-serif" font-size="14" fill="#334155">• Timeout, Retry-After, and rate-limit diagnostics</text>
  <text x="92" y="447" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Best for URLs, CI, headless jobs, and remote automation</text>

  <rect x="585" y="310" width="430" height="142" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="800" y="342" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e" text-anchor="middle">Local Plugin backend</text>
  <text x="612" y="375" font-family="Arial, sans-serif" font-size="14" fill="#334155">• Explicit JSON_REST_V1 selection capture</text>
  <text x="612" y="399" font-family="Arial, sans-serif" font-size="14" fill="#334155">• Pairing-token authentication on loopback</text>
  <text x="612" y="423" font-family="Arial, sans-serif" font-size="14" fill="#334155">• One bounded, memory-only snapshot</text>
  <text x="612" y="447" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Best for the design currently open in Figma Desktop</text>

  <path d="M280 452 L400 482" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 452 L680 482" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="210" y="488" width="660" height="56" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="540" y="514" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Shared: compact inspector • design tokens • React/Vue/Svelte/HTML generator</text>
  <text x="540" y="535" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Read-only default. Any future write capability requires separate tools and review.</text>
</svg>
